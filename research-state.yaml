outer_loop:
  cycle: 9
  last_direction: "CONCLUDE — H5b refines F5: temporal ordering dominates, sequential integration adds incrementally. Paper updated."
  last_reflection: |
    H5b cross-attention + sinusoidal PE results:
    - Baseline (no pose):       0.6745
    - H5 cross-attn (no PE):   0.6765 (Δ=+0.3% WORSE — bag-of-items failure)
    - H5b cross-attn + PE:     0.6337 (Δ=-6.0% — PE recovers 79% of GRU advantage)
    - GRU geo_only (best):     0.6231 (Δ=-7.6% — sequential integration adds final 1.6%)

    REVISED F5 INTERPRETATION:
    Temporal ordering (PE) is the dominant requirement for geodesic supervision to work.
    The original H5 failure was primarily due to treating frames as a bag-of-items,
    not because cross-attention fundamentally can't work. Adding sinusoidal PE
    recovers 79% of the gap (0.0408 of 0.0514 total gain).

    GRU's sequential integration adds a further 1.6% improvement, suggesting:
    - The GRU captures BOTH temporal ordering AND causal dependency structure
    - Cross-attention with PE captures ordering but not the causal "what came before"
      at each timestep — the GRU hidden state accumulates a running summary
    - Both mechanisms matter, but ordering is the dominant factor

    COMPLETE PICTURE (updated):
    1. Pose conditioning improves trajectory prediction — confirmed (7.6% best)
    2. Geodesic loss is the dominant signal — confirmed (geo_only beats all combinations)
    3. Geo weight has sharp optimum at w=0.1 — confirmed
    4. Mechanism is past pose encoding, not future supervision — confirmed
    5. REVISED: Temporal ordering is critical (PE alone gives −6.0%); GRU's sequential
       integration adds an incremental further −1.6%. Both matter; ordering dominates.

    Paper updated: F5 refined, Table 2 extended, Figure 3 updated with H5b curve.
    H5b limitation removed from paper; now an experiment result.

