# JOIN KEY: SMPL file stem (int) == Waymo object_id (int) in track_infos.
# COVERAGE: ~80% of SMPL pedestrians have real future data. Avg 52/80 future timesteps valid.
# STATUS: Dataset fix implemented, committed (6b5084d). H1_v2 training running with real data.

