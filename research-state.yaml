outer_loop:
  cycle: 12
  last_direction: "AUDIT + 42-run multi-seed replication — geodesic claim retracted (inert loss), paper rewritten as seed-replicated study + auxiliary-loss audit; xattn+PE is the stable pose win (−3.5%); pose on pretrained backbone −1.9%."
  last_reflection: |
    H7 pretrain → H8/H9 fine-tune 2×2 (pretrain × pose) results:

                           |  No pose  |  With pose  |  Pose Δ
    -----------------------+-----------+-------------+----------
    From scratch (H6)      |  0.4880   |  0.4797     |  −1.7%
    H7 pretrain (H8/H9)    |  0.3861   |  0.3749     |  −2.9%
    Pretrain Δ             |  −20.9%   |  −21.9%     |  —

    H9 (no pose, H7 pretrain): minADE 0.3861, minFDE 0.8166
    H8 (with pose, H7 pretrain): minADE 0.3749, minFDE 0.7769 ← NEW OVERALL BEST
                                                              (−21.9% minADE, −24.5% minFDE vs H6)

    KEY FINDING:
    Full-Waymo pretraining is the largest single lever in this project. The
    579-scene NPZ subset was the binding constraint, not the architecture.
    H7 pretrains the trajectory-only backbone on 231,507 pedestrian agent-batch
    examples across 487k Waymo scenes (30 epochs, USE_POSE_ENCODER=False). H8
    fine-tunes the pose-augmented architecture on the 579-scene subset, loading
    H7 via --pretrained_model and adding the pose encoder + a residual
    zero-init pose_fuser.

    ARCHITECTURAL CHANGE (mtr_encoder.py):
    Added POSE_FUSER_RESIDUAL flag. When True:
    1. Output of pose_fuser is added to obj_polylines_feature (residual)
       rather than replacing it.
    2. Last Linear of pose_fuser is zero-initialized at construction.
    Effect: at fine-tune iter 0 the pose pathway contributes exactly zero, so
    the pretrained backbone passes through unchanged. The pose encoder warms
    up additively without corrupting trajectory features. Verified at iter 0:
    backbone retains H7 representations.

    BUG FIXES DISCOVERED DURING H7 LAUNCH:
    Three pre-existing unconditional accesses to pose-only fields would crash
    when training on the WaymoPretrainDataset (which has no pose data):
    1. mtr_encoder.py:204 — input_dict['obj_poses'] now guarded by
       self.use_pose_encoder.
    2. mtr_decoder.py:777 — input_dict['center_gt_poses'] /
       'center_shape_params' now guarded by 'in input_dict' check.
    3. mtr_decoder.py:537 — forward_ret_dict['center_gt_poses'] /
       'center_shape_params' now guarded by compute_pose_losses flag.

    REVISED COMPLETE PICTURE:
    1. Pose conditioning improves trajectory prediction — confirmed
    2. Geodesic loss is the dominant signal for pose — confirmed
    3. Geo weight has sharp optimum at w=0.1 — confirmed
    4. Mechanism is past pose encoding, not future supervision — confirmed
    5. Temporal ordering is critical; sequential integration adds incrementally — confirmed
    6. HD map context dwarfs pose benefit; pose adds only 1.7% on top of map — confirmed
    7. NEW: Full-Waymo pretraining is the largest lever (~21% minADE),
       independent of whether pose encoder is used (H8 vs H9 control).
       Pose still contributes 2.9% on the H7-pretrained backbone — slightly
       MORE than the 1.7% from-scratch pose benefit. Pose's contribution is
       more visible against a strong trajectory prior than against noisy
       from-scratch features. Future H-series experiments should be run on
       the H7-pretrained backbone, not from scratch.

  prior_cycle_10_reflection: |
    H6 2×2 map × pose interaction results:
    - No pose, no map:    0.6745 (baseline from H2)
    - No pose, with map:  0.4880 (Δ=−27.7% — map dominates routing)
    - GRU+geo, no map:    0.6231 (Δ=−7.6% vs no-pose no-map)
