outer_loop:
  cycle: 2
  last_direction: "PIVOT → DEEPEN — fixed data pipeline, re-running H1+H2 with real GT"
  last_reflection: |
    The critical zero-future-GT bug has been fixed. The processed_scenarios PKL files
    contain real 91-step Waymo tracking trajectories for all agents. After joining
    by object_id, 80% of SMPL pedestrians have real future data (avg 52/80 steps valid).

    H1_v2 training is running. First epoch shows:
    - loss: 1138 → 161 across 57 batches (dropping fast)
    - ade: 0.95 → 0.76 (non-zero! real trajectory signal)

    Previous H1/H2 results (minADE 0.61 vs 0.77) are INVALID due to 8-sample eval.
    Once H1_v2 and H2_v2 complete, we will have our first reliable comparison.

