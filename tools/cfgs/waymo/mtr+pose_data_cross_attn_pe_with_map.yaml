DATA_CONFIG:
    DATASET: WaymoPoseDataset
    OBJECT_TYPE: &object_type ['TYPE_PEDESTRIAN']

    DATA_ROOT: '/home/erik/NAS/publicdatasets/waymo_motion/v_1_3_0/uncompressed/generated_motion/final_10fps'
    SPLIT_DIR: {
        'train': 'training',
        'test': 'validation'
    }

    SAMPLE_INTERVAL: {
        'train': 1,
        'test': 1
    }

    NUM_PAST_TIMESTAMPS: 11
    NUM_FUTURE_TIMESTAMPS: 80
    DT: 0.1

    PROCESSED_SCENARIOS_PATH: '/home/erik/NAS/personal/waymo_agent_batch'

    WITHOUT_HDMAP: False

    DATALOADER_DROP_LAST: True

    POINT_SAMPLED_INTERVAL: 1
    NUM_POINTS_EACH_POLYLINE: 20
    VECTOR_BREAK_DIST_THRESH: 1.0
    NUM_OF_SRC_POLYLINES: 768
    CENTER_OFFSET_OF_MAP: &center_offset [30.0, 0]


MODEL:
    CONTEXT_ENCODER:
        NAME: MTREncoder

        NUM_OF_ATTN_NEIGHBORS: 16
        NUM_INPUT_ATTR_AGENT: 29
        NUM_INPUT_ATTR_MAP: 9

        NUM_CHANNEL_IN_MLP_AGENT: 256
        NUM_CHANNEL_IN_MLP_MAP: 64
        NUM_LAYER_IN_MLP_AGENT: 3
        NUM_LAYER_IN_MLP_MAP: 5
        NUM_LAYER_IN_PRE_MLP_MAP: 3

        D_MODEL: 256
        NUM_ATTN_LAYERS: 6
        NUM_ATTN_HEAD: 8
        DROPOUT_OF_ATTN: 0.1

        USE_LOCAL_ATTN: True

        # H5b: cross-attention pose encoder WITH sinusoidal positional encoding
        USE_CROSS_ATTN_POSE: True
        USE_POSE_SINUSOIDAL_PE: True
        NUM_PAST_TIMESTAMPS: 11
        DROPOUT_OF_POSE_FUSER: 0.1

    MOTION_DECODER:
        NAME: MTRDecoder

        OBJECT_TYPE: *object_type
        CENTER_OFFSET_OF_MAP: *center_offset

        NUM_FUTURE_FRAMES: 80
        NUM_MOTION_MODES: 6

        INTENTION_POINTS_FILE: data/waymo/cluster_64_center_dict.pkl

        D_MODEL: 512
        NUM_DECODER_LAYERS: 6
        NUM_ATTN_HEAD: 8
        MAP_D_MODEL: 256
        DROPOUT_OF_ATTN: 0.1

        NUM_BASE_MAP_POLYLINES: 256
        NUM_WAYPOINT_MAP_POLYLINES: 128

        # H5b: same geo_only loss as best GRU run
        LOSS_WEIGHTS: {
            'cls': 1.0,
            'reg': 1.0,
            'vel': 0.5,
            'mpjpe': 0.0,
            'geo': 0.1,
            'cls_pose': 0.0,
            'gmm_pose': 0.1
        }

        NMS_DIST_THRESH: 2.5
        SMPL_MODEL_DIR: '/home/erik/ssd2/gitprojects/MTR_with_poses/models'


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 10
    NUM_EPOCHS: 30

    OPTIMIZER: AdamW
    LR: 0.0001
    WEIGHT_DECAY: 0.01

    SCHEDULER: lambdaLR
    DECAY_STEP_LIST: [10, 20, 25]
    LR_DECAY: 0.5
    LR_CLIP: 0.000001

    GRAD_NORM_CLIP: 1.0
