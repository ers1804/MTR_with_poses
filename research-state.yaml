outer_loop:
  cycle: 6
  last_direction: "DEEPEN — geodesic loss is the dominant signal; explore geo weight tuning and cross-attention encoder (H5)"
  last_reflection: |
    H3 loss ablation complete. Full results (best minADE, lower is better):
    - no pose (H2_v2):        0.6745 (baseline)
    - mpjpe_only (run_008):   0.6576 (Δ=-2.5%)
    - full model (run_003):   0.6532 (Δ=-3.2%)
    - gmm_only (run_009):     0.6467 (Δ=-4.1%)
    - geo_only (run_010):     0.6231 (Δ=-7.6%) ← NEW BEST

    MAJOR FINDING: Geodesic loss alone outperforms the full model (all 4 losses combined)
    by 4.6% relative. The rotation-space geodesic supervision in SO(3) is the dominant
    driver of trajectory improvement from pose conditioning.

    WHY GEO BEATS THE FULL MODEL:
    - MPJPE requires forward kinematics (pose → joints), introducing a nonlinear
      transformation that blurs gradient signal to the GRU encoder
    - Geodesic distance directly penalizes rotation errors, forcing the GRU to learn
      orientation-aware representations that transfer to trajectory prediction
    - cls_pose and MPJPE may conflict with geodesic by pulling the shared GRU features
      in incompatible directions
    - GMM-only (0.6467) > MPJPE-only (0.6576), showing WTA regression structure
      provides richer supervision than point-wise joint-space L1

    NEXT PRIORITIES:
    1. Optimize geo_only: tune geo weight (currently 0.1). Optimal weight may differ
       from the full model since geo is now the sole signal. Try w=0.05, 0.2.
    2. H5: Cross-attention pose encoding. Since benefit is from past encoder, replacing
       GRU+MLP with cross-attention could amplify the 7.6% gain further.
    3. Paper narrative is clear: "geodesic rotation loss in SO(3) is the right
       inductive bias for conditioning trajectory prediction on body poses"

