# ===== 2026-06-12: AUDIT + MULTI-SEED REPLICATION (cycle 12) =====
# CRITICAL: geodesic loss proven INERT on 10fps data (zero gradient vs all-zero
# future pose targets; 5/91,520 steps nonzero). "geo_only" ≡ "gmm_only" (both
# WTA-L1 0.1); the draft's headline "geodesic −7.6%" was seed noise. The
# "gmm_pose" loss is actually WTA-L1, not a GMM NLL. See findings.md
# "CRITICAL CORRECTION" section for the full audit.
multiseed_matrix:
  date: "2026-06-12"
  runs: 42  # 12 cells × 3 seeds (101/202/303) + 404/505 for baseline/wta01/geo_pure
  tags: "MS_<cell>_s<seed> under output/waymo/<cfg>/"
  protocol: "identical to draft runs; per-agent metrics_epoch_N.pkl saved each eval"
  analysis: "tools/scripts/analyze_multiseed.py (mean±std + paired bootstrap, n=6688 peds)"
  launcher: "tools/scripts/run_multiseed_matrix.sh + run_multiseed_phase2.sh"
  cells_minADE_best:  # mean±std over seeds
    baseline:   "0.6604±0.0143 (5)"
    geo_pure:   "0.6545±0.0271 (5)  # GRU, no active aux"
    wta01:      "0.6853±0.0651 (5)  # GRU+WTA — 2/5 failure seeds"
    gmm_only:   "0.7403±0.1354 (3)  # same config as wta01; pooled 8 seeds: 0.7060±0.0921"
    mpjpe:      "0.6769±0.0421 (3)"
    full:       "0.6574±0.0237 (3)"
    xattn:      "0.6667±0.0407 (3)"
    xattn_pe:   "0.6371±0.0026 (3)  # STABLE WINNER, −3.5% vs baseline [CI −4.0,−3.0]"
    map_nopose: "0.4876±0.0033 (3)"
    map_wta01:  "0.4854±0.0057 (3)  # pose Δ −0.45% p=0.046"
    ft_nopose:  "0.3791±0.0033 (3)"
    ft_wta01:   "0.3718±0.0059 (3)  # pose Δ −1.90% [−2.8,−1.0] pedestrian-boot; hierarchical p=0.10 (marginal)"
  conclusions:
    - "Encoder decides whether pose helps: xattn+PE stable −3.5%; GRU heavy-tailed, mean worse than baseline"
    - "Temporal ordering necessary (bag-of-frames +1.0% worse than baseline)"
    - "Draft claim 'GRU beats xattn+PE by 1.6%' REVERSED (+7.6% in favor of xattn+PE)"
    - "Aux-loss composition not rankable; no-aux GRU is the only GRU cell that helps (−0.9%)"
    - "Map −26.2% / pretrain −22.3%; both eliminate the instability (0 failures in 12 seeds)"
    - "Pose benefit grows with backbone quality: −0.45% scratch+map → −1.9% pretrained (point estimates)"
  # 2026-07-08 hierarchical-bootstrap (resample seeds THEN pedestrians) added to analyze_multiseed.py.
  # SURVIVES seed resampling: baseline→xattn_pe −3.5% p<1e-4; xattn→xattn_pe −4.5% p=0.008;
  #   map −27% and pretrain −22% p<1e-4. WEAKENS/loses: baseline→geo_pure −0.9% p=0.59;
  #   map_nopose→map_wta01 −0.45% p=0.62; ft_nopose→ft_wta01 −1.9% p=0.10 (marginal, CI just crosses 0).
  # Paper significance language + Limitations updated to rely on the hierarchical test.

