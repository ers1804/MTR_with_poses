project:
  title: "MTR with SMPL Poses"
  question: "Does conditioning on past SMPL body poses improve pedestrian trajectory prediction in MTR, and what is the best pose-trajectory joint learning strategy?"
  status: active
  started: "2026-04-01"
  domain: "trajectory prediction, human pose estimation, autonomous driving"

literature:
  key_papers:
    - id: "shi2022mtr"
      title: "Motion Transformer with Global Intention Localization and Local Movement Refinement"
      authors: "Shi et al."
      year: 2022
      relevance: "Base model — MTR for multimodal trajectory prediction on Waymo Open Motion"
    - id: "loper2015smpl"
      title: "SMPL: A Skinned Multi-Person Linear Model"
      authors: "Loper et al."
      year: 2015
      relevance: "Parametric human body model used for pose representation"
    - id: "zhou2019continuity"
      title: "On the Continuity of Rotation Representations in Neural Networks"
      authors: "Zhou et al."
      year: 2019
      relevance: "6D rotation representation used for pose encoding (avoids gimbal lock)"
  open_problems:
    - "Prior work (salzmann2023robots, saadatnejad2024socialtransmotion, gao2025socialpose) uses skeleton keypoints — no existing work uses parametric SMPL 6D rotations + geodesic supervision within a SOTA AV forecasting framework (MTR/Waymo)"
    - "It is unclear whether pose information helps or hurts trajectory prediction (different agents, noise in SMPL estimates)"
    - "Multimodal pose prediction (6 modes) needs a proper GMM loss on SO(3)"
  evidence_gaps:
    - "MPJPE vs geodesic loss trade-off for SMPL pose supervision"
    - "Whether GRU+MLP fusion is sufficient or cross-attention is needed for pose encoding"

hypotheses:
  - id: H0_data_fix
    statement: "30fps SMPL dataset provides AMASS pseudo-GT future poses for the full 91-step Waymo grid, enabling proper future pose supervision instead of all-zero GT."
    status: supported
    motivation: "Critical insight: 10fps data only has past poses (7 observations). 30fps data has N consecutive rows starting at waymo_timestamps[0], covering both past AND pseudo-GT future. Zero future GT actively trains the pose decoder toward mean/zero poses."
    priority: high
    result:
      notes: "30fps data confirmed: 99% alignment between valid trajectory steps and nonzero pose steps. Dataset updated to detect format via '30fps_timestamps' key. H1_v3 training launched."

  - id: H0
    statement: "The data loading pipeline works correctly: timestamps are in microseconds and must be divided by 1e6 before mapping to the Waymo time grid."
    status: supported
    motivation: "Critical sanity check — waymo_timestamps are [0, 100020, 200010, ...] µs, not seconds. Without fixing this, all pose data maps to wrong timesteps."
    priority: high

  - id: H1
    statement: "A baseline MTR+pose model (GRU encoder + MPJPE + geodesic + NLL loss) can be successfully trained on the extracted Waymo pose dataset and converge within 30 epochs."
    status: in_progress
    run_tag: "H1_v2_real_traj"
    started: "2026-04-02T08:45"
    motivation: "Must establish that the full pipeline (data loading → encoding → decoding → loss) is bug-free before ablating components."
    priority: high
    result:
      epoch_1_loss: 161.170
      epoch_1_ade: 0.762
      notes: "Re-running with real Waymo future trajectories (dataset fix). Training in progress."

  - id: H2
    statement: "Conditioning on past SMPL poses improves pedestrian minADE/minFDE vs. a trajectory-only baseline (ablation: GRU pose encoder disabled, all pose losses zeroed)."
    status: pending
    run_tag: "H2_v2_real_traj"
    motivation: "Core research question. Pose reveals walking direction, gait phase, and interaction context that trajectory alone cannot capture."
    priority: high
    notes: "Will run after H1_v2 completes."

  - id: H3
    statement: "MPJPE + geodesic combined loss outperforms either loss alone for pose supervision quality."
    status: refuted
    motivation: "MPJPE operates in joint position space; geodesic in rotation space. They are complementary supervisory signals."
    priority: medium
    result:
      notes: "REFUTED — geo_only (0.6231) OUTPERFORMS full model (0.6532) by 4.6% relative. Combined MPJPE+geo HURTS. Geodesic alone is the dominant signal. MPJPE introduces FK nonlinearity that blurs gradient flow to GRU."

  - id: H4
    statement: "Pose mode classification loss (cls_pose) is necessary for sharp multimodal pose prediction; removing it degrades MPJPE."
    status: pending
    motivation: "Without mode selection supervision, all modes collapse to the mean pose."
    priority: medium

  - id: H5
    statement: "The current GRU+MLP pose encoding is a bottleneck; replacing it with cross-attention between pose tokens and agent features improves both trajectory and pose metrics."
    status: refuted
    motivation: "GRU compresses the entire past pose sequence into one vector before fusion. Cross-attention could attend to relevant timesteps."
    priority: low
    result:
      best_minADE: 0.6765
      best_epoch: 27
      notes: "REFUTED — cross-attention (0.6765) essentially matches the trajectory-only baseline (0.6745). NO improvement from cross-attention vs GRU which achieved 0.6231. Root cause: cross-attention without positional encoding treats 11 pose frames as a bag-of-items, losing temporal ordering. GRU's sequential inductive bias is critical for geodesic supervision of gait dynamics."

  - id: H7
    statement: "Pretraining the trajectory-only backbone on the full Waymo pedestrian set (231k agent-batch examples across 487k scenes) and fine-tuning the pose-augmented architecture on the 579-scene NPZ subset removes the dataset-size bottleneck and yields a substantially better final minADE/minFDE than any from-scratch H1–H6 variant."
    status: supported
    motivation: "All H1–H6 ablations train from scratch on 579 scenes — far too small to learn a strong trajectory prior. Architectural ablations on this regime may underestimate the value of pretrained representations. Test by pretraining the backbone on the full Waymo pedestrian set, then fine-tuning the pose-augmented model from that backbone."
    priority: high
    config_pretrain: "tools/cfgs/waymo/mtr+full_ped_pretrain.yaml"
    config_finetune: "tools/cfgs/waymo/mtr+full_ped_finetune_geo.yaml"
    architectural_change: "Added POSE_FUSER_RESIDUAL flag to MTREncoder. When True, output of pose_fuser is added to obj_polylines_feature (residual) rather than replacing it, and the last Linear of pose_fuser is zero-initialized so the pose pathway contributes zero at fine-tune iter 0. This preserves the pretrained backbone exactly while allowing the pose pathway to warm up additively."
    result:
      pretrain_minADE: "not evaluated (Waymo TF eval skipped)"
      finetune_best_minADE: 0.3749
      finetune_best_minFDE: 0.7769
      finetune_vs_h6_geo_map: "−21.9% minADE, −24.5% minFDE vs H6 geo+map from scratch (0.4797 / 1.0284)"
      notes: "SUPPORTED — full-Waymo pretraining is the single largest lever in this project. The 579-scene subset was the binding constraint, not the architecture."

  - id: H5b
    statement: "Cross-attention + sinusoidal positional encoding closes the gap with GRU — temporal ordering is sufficient, sequential processing is not needed."
    status: partially_confirmed
    motivation: "H5 used cross-attention without PE, treating frames as a bag-of-items. Adding sinusoidal PE restores temporal ordering. If PE alone closes the gap, it implies ordering matters but the GRU's sequential integration is not the key ingredient."
    priority: high
    prediction: "If PE matters: minADE will improve over H5 (0.6765) toward GRU+geo (0.6231). If sequential integration is what matters: PE will provide minimal benefit and result will stay near baseline."
    config: "mtr+pose_data_cross_attn_pe.yaml"
    extra_tag: "H5b_cross_attn_pe_geo_only"
    started: "2026-04-03"
    result:
      best_minADE: 0.6337
      best_epoch: 24
      notes: "PARTIALLY CONFIRMED — PE recovers 79% of GRU's advantage (0.6765→0.6337, Δ=-6.0% vs baseline). GRU still wins by 1.6% (0.6337 vs 0.6231). Revised interpretation: temporal ORDERING is the dominant requirement (PE captures this). Sequential INTEGRATION (GRU hidden state) provides an additional incremental gain. Both matter, but ordering dominates."

