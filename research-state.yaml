outer_loop:
  cycle: 4
  last_direction: "BROADEN — pose weight ablation complete, improvement is robust; consider data scaling"
  last_reflection: |
    Pose weight ablation complete: w=0.05, 0.1, 0.2 all tested, plus no-pose baseline.

    ABLATION RESULTS (best minADE, lower is better):
    - no pose (H2_v2):   0.6745 (baseline)
    - w=0.05 (run_005):  0.6557 (Δ=-2.8%)
    - w=0.1  (run_003):  0.6532 (Δ=-3.2%) ← OPTIMAL
    - w=0.2  (run_006):  0.6542 (Δ=-3.0%)

    CONCLUSION: Pose conditioning improvement is robust across [0.05, 0.2]. The benefit
    of ~3% is consistent — not a lucky hyperparameter. Weight=0.1 is optimal but the
    difference between 0.05 and 0.2 is only 0.4%.

    KEY FIXES APPLIED (from cycle 3):
    - NaN divergence: reduced pose loss weights from 1.0 to 0.1
    - geodesic_distance_6d: fixed clamp to use 1e-7 margin (not exact ±1.0)
    - YAML duplicate keys: cleaned up mtr+pose_data.yaml

    NEXT PRIORITIES:
    1. Scale data — 579 training scenes is tiny. Explore 30fps SMPL dataset for more scenes.
    2. Run H3 (MPJPE-only vs geodesic-only vs combined) to understand pose loss contributions
    3. Consider cross-attention pose encoding (H5) if data scaling is not immediately feasible

