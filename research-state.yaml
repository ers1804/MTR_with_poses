outer_loop:
  cycle: 5
  last_direction: "DEEPEN — mechanism localized to past pose encoder; ablate pose loss components (H3)"
  last_reflection: |
    H1_v3 null result clarifies the mechanism. Full results (best minADE):
    - no pose (H2_v2):        0.6745 (baseline)
    - w=0.05 (run_005):       0.6557 (Δ=-2.8%)
    - w=0.1  (run_003):       0.6532 (Δ=-3.2%) ← OPTIMAL
    - w=0.2  (run_006):       0.6542 (Δ=-3.0%)
    - 30fps AMASS (run_007):  0.6567 (Δ=-2.6%) ← NULL RESULT

    KEY MECHANISTIC INSIGHT: run_007 (30fps AMASS pseudo-GT, 99% future pose coverage)
    gives minADE=0.6567 — virtually identical to H1_v2 (0.6532) which had zero future GT.
    Conclusion: the trajectory benefit from pose conditioning comes entirely from the GRU
    past pose encoder. Better future pose supervision does NOT improve trajectory prediction.
    The mechanism is: past poses → GRU → 256D feature → fused with trajectory encoder →
    richer queries in the MTR decoder → better trajectory predictions.

    DATA SCALING RULED OUT AS NEXT PRIORITY: 30fps dataset uses AMASS-simulated future
    poses, not more real Waymo data. Additional scenes would have the same limitation.
    The ~2.6-3.2% gain is already reliably demonstrated.

    NEXT PRIORITIES:
    1. H3 ablation: Which pose loss component drives the trajectory benefit?
       - MPJPE-only: does joint-space supervision suffice?
       - geodesic-only: does rotation-space supervision suffice?
       - cls_pose-only: is multimodal classification the key signal?
       - Insight: if trajectory benefit persists with ANY single loss, the GRU encoder
         learns useful pose features regardless of loss type. If it vanishes, the
         combined supervisory signal is critical.
    2. H5: Replace GRU+MLP with cross-attention pose encoding. Since past encoding is
       the mechanism, architectural improvements here could amplify the 3.2% gain.

